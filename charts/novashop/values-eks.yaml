global:
  environment: eks
  domain: ""

ui:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

catalog:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

cart:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

orders:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

checkout:
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/group.name: devopsatolyesi-shared
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
  hosts:
    - host: "novashop.devopsatolyesi.com"
      paths:
        - path: /
          pathType: Prefix
          service:
            name: novashop-ui
            port: 8080
    - host: ""
      paths:
        - path: /
          pathType: Prefix
          service:
            name: novashop-ui
            port: 8080
