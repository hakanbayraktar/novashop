name: "01 - EKS Altyapısı (Terraform)"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Çalıştırılacak Terraform işlemi"
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]

permissions:
  contents: read

concurrency:
  group: novashop-eks-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.action == 'apply' && 'eks-training' || '' }}
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: AWS access key kimlik doğrulaması
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: NovaShopTerraform
      - name: Terraform başlat
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=novashop/eks/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
      - name: Biçim ve doğrulama
        run: |
          terraform fmt -check -recursive
          terraform validate
      - name: Terraform plan
        run: terraform plan -out=tfplan
      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
      - name: kubectl ve Helm kur
        if: inputs.action == 'apply'
        uses: azure/setup-helm@v4
      - name: EKS kubeconfig oluştur
        if: inputs.action == 'apply'
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME || 'novashop-training' }}"
      - name: AWS Load Balancer Controller kur
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        run: |
          LBC_ROLE_ARN=$(terraform output -raw aws_load_balancer_controller_role_arn)
          VPC_ID=$(terraform output -raw vpc_id)
          CLUSTER_NAME="${{ vars.EKS_CLUSTER_NAME || 'novashop-training' }}"
          
          echo "AWS Load Balancer Controller kuruluyor..."
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="$CLUSTER_NAME" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$LBC_ROLE_ARN" \
            --set region="${{ vars.AWS_REGION }}" \
            --set vpcId="$VPC_ID" \
            --wait --timeout 5m
      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve
