name: "01 - EKS Altyapısı (Terraform)"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Çalıştırılacak Terraform işlemi"
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]

permissions:
  contents: read
  id-token: write

concurrency:
  group: novashop-eks-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.action == 'apply' && 'eks-training' || '' }}
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_actions_role_arn: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: AWS OIDC kimlik doğrulaması
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: NovaShopTerraform
      - name: Terraform başlat
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=novashop/eks/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
      - name: Biçim ve doğrulama
        run: |
          terraform fmt -check -recursive
          terraform validate
      - name: Terraform plan
        run: terraform plan -out=tfplan
      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve
