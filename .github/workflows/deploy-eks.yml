name: "02 - NovaShop EKS Uygulama Dağıtımı"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novashop-eks-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: eks-training
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY: novashop-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Birim testleri
        working-directory: src/ui
        run: ./mvnw test -B
      - name: AWS access key kimlik doğrulaması
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: NovaShopDeploy
      - name: Amazon ECR girişi
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: UI image derle ve ECR'a gönder
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker build --file src/ui/Dockerfile \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" src/ui
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
      - name: kubectl ve Helm kur
        uses: azure/setup-helm@v4
      - name: EKS kubeconfig oluştur
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
      - name: AWS Load Balancer Controller kontrol et / kur
        run: |
          if ! helm status aws-load-balancer-controller -n kube-system >/dev/null 2>&1; then
            echo "AWS Load Balancer Controller bulunamadı, kuruluyor..."
            LBC_ROLE_ARN=$(aws iam get-role --role-name "$CLUSTER_NAME-aws-load-balancer-controller" --query "Role.Arn" --output text)
            VPC_ID=$(aws eks describe-cluster --name "$CLUSTER_NAME" --region "$AWS_REGION" --query "cluster.resourcesVpcConfig.vpcId" --output text)
            helm repo add eks https://aws.github.io/eks-charts
            helm repo update
            helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
              --namespace kube-system \
              --set clusterName="$CLUSTER_NAME" \
              --set serviceAccount.create=true \
              --set serviceAccount.name=aws-load-balancer-controller \
              --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$LBC_ROLE_ARN" \
              --set region="$AWS_REGION" \
              --set vpcId="$VPC_ID" \
              --wait --timeout 5m
          else
            echo "AWS Load Balancer Controller zaten kurulu ve çalışıyor."
          fi
      - name: Helm ile dağıt
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          helm upgrade --install novashop charts/novashop \
            --namespace novashop --create-namespace \
            --values charts/novashop/values-eks.yaml \
            --set ui.image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set ui.image.tag="$IMAGE_TAG" \
            --wait --timeout 10m
      - name: ALB adresini doğrula
        run: |
          for attempt in {1..30}; do
            ALB_HOST=$(kubectl get ingress novashop-ingress -n novashop \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -n "$ALB_HOST" ]; then
              if curl -fsSL --retry 3 "http://$ALB_HOST/actuator/health" > /dev/null 2>&1; then
                echo "ALB_URL=http://$ALB_HOST" >> "$GITHUB_STEP_SUMMARY"
                echo "Uygulama başarıyla erişilebilir: http://$ALB_HOST"
                exit 0
              fi
            fi
            echo "ALB veya DNS henüz hazır değil, bekleniyor ($attempt/30)..."
            sleep 10
          done
          echo "ALB adresi zamanında atanmadı veya erişilemedi." >&2
          exit 1
